services:
  db:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped
  api:
    build: ./backend
    env_file: .env
    environment: { DB_HOST: db }
    depends_on: [db]
    ports: ["8000:8000"]
    command: sh -c "python manage.py migrate && gunicorn config.wsgi -b 0.0.0.0:8000 -w 4"
    restart: unless-stopped
volumes:
  pgdata:
